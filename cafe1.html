<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunny's Café | CafeSpot</title>

  <style>
    body {
      background-color: #fdfaf6;
      color: #3b2a1a;
      font-family: Arial, Helvetica, sans-serif;
    }

    .navbar {
      width: 100%;
      height: 70px;
      background-color: #271a1a;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 25px;
      padding-top: 10px;
    }

    .nav-links li a {
      text-decoration: none;
      color: aliceblue;
      font-size: 18px;
      position: relative;
    }

    .nav-links li a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      background: #f9b208;
      left: 0;
      bottom: -4px;
      transition: 0.3s;
    }

    .nav-links li a:hover::after {
      width: 100%;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #b98303;
      font-family: "Cursive","papyrus", sans-serif;
      letter-spacing: 3px;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
      max-width: 1000px;
      margin: auto;
    }

    hr {
      border: none;
      height: 2px;
      background-color: #d1bfa3;
      margin: 40px auto;
      width: 80%;
    }

    .image-gallery, .menu-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      justify-items: center;
    }

    .image-gallery img, .menu-gallery img {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    form {
      background: #fff;
      padding: 25px;
      margin-top: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    form button {
      width: 100%;
      padding: 12px;
      background-color: #4b2a10;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .message {
      background: #e4e3e1;
      color: #473220;
      padding: 12px;
      margin-top: 15px;
      border-radius: 10px;
      font-weight: 600;
      display: none;
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="logo">CafeSpot</div>
    <ul class="nav-links">
      <li><a href="#cafeimages">Cafe Images</a></li>
      <li><a href="#menu">Menu</a></li>
      <li><a href="#book">Book Table</a></li>
    </ul>
  </nav>

  
  <section class="section" id="cafeimages">
    <h2>Sunny's Café - Gallery</h2>
    <div class="image-gallery">
      <img src="cafe1cc.avif" alt="Cafe Interior">
      <img src="cafe1dd.avif" alt="Cafe Ambience">
    </div>
  </section>

  <hr>

  <section class="section" id="menu">
    <h2>Our Menu</h2>
    <div class="menu-gallery">
      <img src="cafe11.webp">
      <img src="cafe12.webp">
      <img src="cafe13.webp">
    </div>
  </section>

  <hr>

  <section class="section" id="book">
    <h2>Book Your Table</h2>

    <form onsubmit="submitBooking(event)">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="tel" id="phone" placeholder="Contact Number" pattern="[0-9]{10}" maxlength="10" required>
      <input type="number" id="seats" placeholder="No. of Seats" min="1" max="10" required>
      <input type="date" id="date" required>
      <input type="time" id="time" required>
      <button type="submit">Book Now</button>

      <div id="bookingMessage" class="message"></div>
    </form>
  </section>
<script>
  async function showBookingMessage(event) {
    event.preventDefault();

    // Collect user inputs
    const name = document.querySelector('input[placeholder="Full Name"]').value;
    const phone = document.getElementById("phone").value;
    const seats = document.getElementById("seats").value;
    const time = document.querySelector('input[type="time"]').value;
    const date = new Date().toISOString().split("T")[0]; // today's date (or you can add a <input type="date">)
    const cafeName = "Sea Rock Cafe"; // Change per cafe page (like "Sloshed Eatery", etc.)

    // Validate phone
    if (phone.length !== 10 || isNaN(phone)) {
      alert("Please enter a valid 10-digit phone number.");
      return;
    }

    // Validate seats
    if (seats < 1 || seats > 10) {
      alert("You can book between 1 to 10 seats only.");
      return;
    }

    // Send booking to backend
    try {
      const response = await fetch("http://localhost:5000/bookings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, phone, seats, time, date, cafeName }),
      });

      if (response.ok) {
        document.getElementById("bookingMessage").style.display = "block"; // Show success message
        event.target.reset(); // Clear the form
      } else {
        alert("❌ Booking failed! Please try again.");
      }
    } catch (error) {
      alert("⚠️ Server not running! Start backend with: node server.js");
      console.error(error);
    }
  }
</script>
</body>
</html>
